name: sorttrash
description: EVERGREEN - an educational mobile game about protecting the environment.
publish_to: 'none'

version: 2.0.0+3

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^6.8.1
  cloud_firestore: ^7.0.0
  confetti: ^0.8.0
  email_validator: ^3.0.0
  firebase_auth: ^7.0.0
  firebase_core: ^5.0.0
  hive_ce: ^2.22.0
  hive_ce_flutter: ^2.5.0
  internet_connection_checker_plus: ^3.1.2
  percent_indicator: ^4.2.5
  uuid: ^4.6.0
  video_player: ^2.14.1
  book_page_flip: ^0.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.16.2
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  hive_ce_generator: ^1.12.0

flutter_launcher_icons:
  image_path: "assets/images/logo.png"
  android: true
  ios: true
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  fonts:
    - family: Digital
      fonts:
        - asset: assets/fonts/Digital-Medium.ttf

  assets:
    - assets/images/
    - assets/music/
    - assets/Videos/
    - assets/images/puzzle/level1/
    - assets/images/puzzle/level2/
    - assets/images/puzzle/level3/
    - assets/images/puzzle/level4/
    - assets/images/puzzle/level5/
    - assets/images/trophies/
    - assets/images/quiz/niveau1/
    - assets/images/quiz/niveau2/
    - assets/profiles/
    - assets/images/plastic/
    - assets/images/paper/
    - assets/images/organic/
    - assets/images/e_waste/
    - assets/images/non_recyclable/
    - assets/images/storys/
    - assets/music/histoires/story1/
